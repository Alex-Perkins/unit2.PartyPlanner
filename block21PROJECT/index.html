<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Party Planner Recipes </title>
    <script src="./index.js" defer></script>
    <link rel="stylesheet" href="./index.css" />
</head>

<body>
    <div class="new-recipe-form">
        <form id="addParty">
            <div class="label-div">
            <label>
                Name
                <input type="text" name="names" />
            </label>
            <label>
                Description
                <input type="text" name="description" />
            </label>
            <label>
                time
                <input type="text" name="time" />
            </label>
            <label>
                location
                <input type="text" name="location" />
            </label>
            <label>
                date
                <input type="date" name="date" />
            </label>
            <button class="theButton">Add Party</button>
            </div>
        </form>
        <ul id="events"></ul>
    </div>
<div id="parties-container"></div>
</body>

</html>
